# dsh-agent-soul 的 bundle 补丁层：把本插件作为一行插进 profile 的条目列表。
#
# ⚠️ name 必须写【裸包名】，且与下面四处完全一致，否则插件加载不了：
#   1. package.json 的 "name"
#   2. lib/index.js 导出的 name
#   3. 插件安装后的**目录名**（DSH 按目录名去 node_modules 里找包，nearestPackage 会校验两者相等）
#   4. 本文件里的 name
# 对不上就会被跳过 —— 表现为工具不出现、设置页没入口，而且日志里往往没有明确报错。
- insert:
    - id: agent-soul
      name: dsh-agent-soul
